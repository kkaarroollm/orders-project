[project]
name = "orders-project-workspace"
version = "0.3.2"
description = "Workspace root for all Python services"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ty>=0.0.1a7",
    "ruff==0.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.workspace]
members = ["shared", "orders", "delivery", "notifications", "simulator"]

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
fix = false
include = [
    "*/src/**/*.py",
]
# Each service keeps its own `src/` package; listing the service roots here
# preserves the first-party classification they had when ruff ran per-service.
src = ["orders", "delivery", "notifications", "simulator"]

[tool.ruff.lint]
select = ["I", "PL", "F401", "F841", "N", "R", "E501"]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "pydantic.validator",
    "pydantic.field_validator",
    "declared_attr",
    "expression",
    "comparator"
]
